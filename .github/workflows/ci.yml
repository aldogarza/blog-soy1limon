name: CI

# Runs on pull requests and pushes to main. Uses no repository secrets, so pull requests
# from forks are safe. Never switch this to `pull_request_target`.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The watermark test renders text; pin the font instead of relying on the runner image.
      - name: Install fonts for watermark rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  db-integration:
    name: Database (migrations, RLS, queries)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Throwaway local stack: applies every migration and the seed. No secrets involved.
      - run: pnpm db:start

      - name: Generated database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- packages/db/src/database.types.ts

      - run: pnpm test:integration

  admin-e2e:
    name: Admin end-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install fonts for watermark rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - run: pnpm install --frozen-lockfile

      # Throwaway local stack: the e2e config refuses any non-local Supabase URL.
      - run: pnpm db:start

      - name: Install Chromium and its system libraries
        run: pnpm --filter @soy1limon/admin exec playwright install --with-deps chromium-headless-shell

      - run: pnpm test:e2e

  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${archive}$" | sha256sum --check
          tar -xzf "${archive}" gitleaks

      - name: Scan
        run: ./gitleaks git --redact --no-banner --verbose
